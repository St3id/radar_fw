const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,50000);
const rnd=new THREE.WebGLRenderer({antialias:true});
rnd.setSize(innerWidth,innerHeight);rnd.setClearColor(0x06100c);
document.body.appendChild(rnd.domElement);
const geo=new THREE.BufferGeometry();
const pos=[],col=[];let zmin=1e9,zmax=-1e9;
PTS.forEach(p=>{if(p[2]<zmin)zmin=p[2];if(p[2]>zmax)zmax=p[2];});
const c0=new THREE.Color(0x14523c),c1=new THREE.Color(0x8ef5c8);
PTS.forEach(p=>{pos.push(p[0],p[2],p[1]);const t=(p[2]-zmin)/Math.max(1,zmax-zmin);const c=c0.clone().lerp(c1,t);col.push(c.r,c.g,c.b);});
geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
const mat=new THREE.PointsMaterial({vertexColors:true,size:45});
const cloud=new THREE.Points(geo,mat);scene.add(cloud);
const r=new THREE.Mesh(new THREE.SphereGeometry(80,16,16),
new THREE.MeshBasicMaterial({color:0xff5d3b}));scene.add(r);
scene.add(new THREE.GridHelper(6000,12,0x1c3a2e,0x1c3a2e));
const selM=new THREE.Mesh(new THREE.SphereGeometry(70,12,12),new THREE.MeshBasicMaterial({color:0xffd23b,wireframe:true}));
selM.visible=false;scene.add(selM);
const selDiv=document.getElementById('sel');
let rotY=0.6,rotX=0.4,dist=5000;
const ctr=new THREE.Vector3(0,0,0);
let down=false,px=0,py=0,moved=0;
addEventListener('mousedown',e=>{down=true;moved=0;px=e.clientX;py=e.clientY;});
addEventListener('mouseup',e=>{down=false;if(moved<5)pick(e);});
addEventListener('mousemove',e=>{if(!down)return;moved+=Math.abs(e.clientX-px)+Math.abs(e.clientY-py);
rotY+=(e.clientX-px)*0.005;rotX+=(e.clientY-py)*0.005;rotX=Math.max(-1.5,Math.min(1.5,rotX));px=e.clientX;py=e.clientY;});
addEventListener('wheel',e=>{dist*=(1+e.deltaY*0.001);dist=Math.max(200,Math.min(30000,dist));});
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function moveCtr(){const sp=dist*0.02;
 const fwd=new THREE.Vector3(ctr.x-cam.position.x,0,ctr.z-cam.position.z).normalize();

 if(keys['z']||keys['w'])ctr.addScaledVector(fwd,sp);
 if(keys['s'])ctr.addScaledVector(fwd,-sp);
 if(keys['q']||keys['a'])ctr.addScaledVector(rgt,-sp);
 if(keys['d'])ctr.addScaledVector(rgt,sp);
 if(keys['r'])ctr.y+=sp;
 if(keys['f'])ctr.y-=sp;}
const ray=new THREE.Raycaster();ray.params.Points.threshold=80;
function pick(e){
 const m=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
 ray.setFromCamera(m,cam);
 const hits=ray.intersectObject(cloud);
 if(!hits.length){selM.visible=false;selDiv.innerHTML='';return;}
 const i=hits[0].index,p=PTS[i];
 selM.visible=true;selM.position.set(p[0],p[2],p[1]);
 const d=p[3],az=p[4],el=p[5];
 selDiv.innerHTML='Point #'+i+'<br>x '+Math.round(p[0])+'  y '+Math.round(p[1])+'  z '+Math.round(p[2])+' mm'+
  '<br>distance '+Math.round(d)+' mm<br>azimut '+az.toFixed(1)+' deg &middot; elevation '+el.toFixed(1)+' deg';}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;
cam.updateProjectionMatrix();rnd.setSize(innerWidth,innerHeight);});
function loop(){requestAnimationFrame(loop);moveCtr();
cam.position.x=ctr.x+Math.cos(rotY)*Math.cos(rotX)*dist;
cam.position.z=ctr.z+Math.sin(rotY)*Math.cos(rotX)*dist;
cam.position.y=ctr.y+Math.sin(rotX)*dist;cam.lookAt(ctr);
rnd.render(scene,cam);}loop();
