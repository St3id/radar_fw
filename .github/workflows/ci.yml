name: Build, Test & Prove

on:
  # Toutes les branches : chaque commit pousse est compile, teste et
  # prouve (avant, seule main l'etait : les branches de travail
  # avancaient sans filet).
  push:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On epingle Alire 2.1.0 : c'est la MEME version qu'en local.
      # Chaque version d'alr est liee a une branche d'index communautaire.
      #   - 2.0.2 (defaut de l'action) -> index "stable-1.3.0" : PAS d'AUnit 26,
      #     ni gnatprove 15.1, ni gnat 15.2  ==> le solveur abandonne AUnit et la
      #     compilation des tests echoue ("aunit.gpr not found").
      #   - 2.1.0 -> index "stable-1.4.0" : contient AUnit 26.0.0, gnatprove 15.1.0
      #     et gnat 15.2.x. La toolchain CI devient coherente avec le poste local.
      - name: Install Alire
        uses: alire-project/setup-alire@v4
        with:
          version: "2.1.0"
          toolchain: "gnat_native gprbuild"

      # Diagnostic : doit afficher gnat 15.2.x / gprbuild 25.x, et un
      # GPR_PROJECT_PATH contenant un dossier .../aunit_26.../lib/gnat.
      - name: Show Alire environment
        run: |
          alr version
          alr toolchain
          alr printenv | grep -i GPR_PROJECT_PATH || true

      # Compile le projet principal et resout/telecharge toutes les dependances.
      - name: Build main project
        run: alr build

      # Compile les tests. "alr exec" injecte GPR_PROJECT_PATH (AUnit inclus),
      # donc "aunit.gpr" est trouve. C'est exactement la commande qui marche
      # en local.
      - name: Build tests
        run: alr exec -- gprbuild -p -P radar_fw_tests.gpr

      # Lance l'executable de tests AUnit produit dans bin/.
      - name: Run tests
        run: alr exec -- ./bin/run_tests

      # ===== Demonstrateur Ravenscar =====
      # Projet separe (radar_demo.gpr) : le profil Ravenscar est impose a
      # tout l'executable par ravenscar.adc. La demo tourne REELLEMENT
      # (8 cycles producteur/consommateur) et se termine toute seule.
      - name: Build Ravenscar demo
        run: alr exec -- gprbuild -p -P radar_demo.gpr

      - name: Run Ravenscar demo
        run: alr exec -- ./bin/radar_demo

      # Rejoue la preuve formelle SPARK sur le projet principal.
      # NB : en local "alr gnatprove" est un alias perso (= "alr exec -P1 --
      # gnatprove"). Cet alias n'existe pas en CI, on l'ecrit donc en clair.
      #   --report=all          : affiche le detail des checks dans le log.
      #   --checks-as-errors=on : fait ECHOUER la CI si un check n'est pas
      #                           prouve (sans ca, gnatprove sort en code 0
      #                           meme avec des checks non prouves).
      - name: SPARK proof (main)
        run: alr exec -- gnatprove -P radar_fw.gpr --report=all --checks-as-errors=on

      # Preuve du projet demo : l'objet protege Mailbox est en SPARK.
      # L'analyse de code concurrent exige le profil Ravenscar et
      # l'elaboration sequentielle, fournis par ravenscar.adc.
      - name: SPARK proof (Ravenscar demo)
        run: alr exec -- gnatprove -P radar_demo.gpr --report=all --checks-as-errors=on

      # ===== Cross-compilation pour la cible embarquee =====
      # Verifie SANS la carte que le coeur algorithmique (src/processing,
      # prouve SPARK) compile pour Cortex-M4F avec le runtime reduit
      # "light" - le processeur du STM32G474 vise. Tout ajout au coeur
      # qui dependrait du PC (Text_IO, Calendar...) casse cette etape.
      # NB : en alr 2.1.0, "alr toolchain" n'a PAS d'option --install
      # (cause de l'echec du premier run). "alr install --prefix" est la
      # commande prevue pour rendre une toolchain visible HORS d'Alire :
      # elle deploie les binaires dans <prefix>/bin.
      - name: Install ARM cross toolchain
        run: alr -n install gnat_arm_elf --prefix="$RUNNER_TEMP/arm-toolchain"

      - name: Cross-build core (arm-eabi, light runtime)
        run: |
          export PATH="$RUNNER_TEMP/arm-toolchain/bin:$PATH"
          if ! command -v arm-eabi-gcc >/dev/null; then
            ARM_GCC=$(find "$RUNNER_TEMP/arm-toolchain" -name 'arm-eabi-gcc' -type f | head -n1)
            if [ -z "$ARM_GCC" ]; then echo "arm-eabi-gcc introuvable" ; exit 1 ; fi
            export PATH="$(dirname "$ARM_GCC"):$PATH"
          fi
          arm-eabi-gcc --version | head -n1
          alr exec -- gprbuild -p -P radar_core.gpr
