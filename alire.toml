name = "radar_fw"
description = "Chaine radar 3D en Ada/SPARK : detection prouvee, pistage, rendu 3D"
version = "0.1.0-dev"

authors = ["Boles Lucas"]
maintainers = ["Boles Lucas <199652347+St3id@users.noreply.github.com>"]
maintainers-logins = ["St3id"]
licenses = "MIT"
website = "https://St3id.github.io/radar_fw/"
tags = ["embedded", "stm32", "radar", "spark", "real-time"]

executables = ["radar_fw"]

[[depends-on]]
gnatprove = "^15.1.0"

[[depends-on]]
aunit = "^26.0.0"

# Contrats evalues a l'execution (-gnata) dans le profil de developpement,
# celui des tests et de la CI. Sans cette ligne, Alire n'ajoute pas -gnata :
# les Pre, Post et Assert du code hors SPARK ne sont jamais verifies, et un
# test peut passer alors qu'un contrat est viole. Le profil release reste
# sans contrats.
[build-switches]
development.contracts = "Yes"